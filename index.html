<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sundararajan Foundation · Samviikta Institute</title>
<meta name="description" content="Samviikta: five 4-week AI courses for rural Tamil Nadu, taught in Tamil on your phone. In memory of Dr. Ln. R. Sundararajan. Run by SRK Educational and Charitable Trust.">
<meta name="theme-color" content="#1f7a4d">
<meta property="og:title" content="Sundararajan Foundation · Samviikta Institute">
<meta property="og:description" content="Learn AI skills on your phone, in Tamil. 4-week courses from ₹199/-.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20140%22%20width%3D%22120%22%20height%3D%22140%22%3E%20%3Ctitle%3ESamviikta%3C/title%3E%20%3Cpath%20d%3D%22M33%2046C29%2034%2024%2024%2025%2012C34%2017%2041%2024%2046%2032C49%2021%2053%2012%2060%205C67%2012%2071%2021%2074%2032C79%2024%2086%2017%2095%2012C96%2024%2091%2034%2087%2046Z%22%20fill%3D%22%23d9a521%22/%3E%20%3Cpath%20d%3D%22M33%2046H87%22%20stroke%3D%22%23b8860b%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%20%3Ccircle%20cx%3D%2260%22%20cy%3D%2238%22%20r%3D%224%22%20fill%3D%22%23ffffff%22/%3E%20%3Cpath%20d%3D%22M82%2066C80%2052%2042%2051%2041%2068C40%2084%2082%2086%2082%20104C82%20125%2041%20124%2039%20110%22%20stroke%3D%22%231f7a4d%22%20stroke-width%3D%2216%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%20%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hind+Madurai:wght@400;500;600;700&display=swap">
<style>
/* Base reset */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
[hidden]{display:none!important}
img,svg{max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Layout: paddy-field bands — deep forest header/hero with kolam dot grid, light leaf-tinted body, course cards in a responsive grid, enrollment as a focused panel. Bilingual: Tamil default, English toggle. */
:root{
  --forest:#eaf6ee;        /* light mint band (hero, detail heads, footer) */
  --forest-2:#ffffff;      /* cards sitting on the mint band */
  --leaf:#1f7a4d;
  --sprout:#bfe5c9;
  --paddy:#f3f8ef;
  --bg:#fbfdf9;
  --surface:#ffffff;
  --fg:#1b2b22;
  --muted:#4d6356;
  --line:#dcebdf;
  --accent:#1f7a4d;
  --accent-fg:#ffffff;
  --turmeric:#d9a521;
  --on-dark:#1b2b22;       /* text on the mint band */
  --on-dark-muted:#4d6356;
  --danger:#b3412f;
  --memo-bg:#f6eddc;--memo-ink:#4a3418;--memo-muted:#7a5f3d;--memo-accent:#9a6a12;--memo-line:#e2cfa8;
  --font-display:"Bricolage Grotesque", "Hind Madurai", "Segoe UI", system-ui, sans-serif;
  --font-body:"Hind Madurai", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --forest:#0a2a20;--forest-2:#0f3a2c;--leaf:#4fb47a;--sprout:#8fd6a0;--paddy:#16271e;
  --bg:#0e1712;--surface:#14201a;--fg:#e4efe6;--muted:#9db5a5;--line:#24382d;
  --accent:#5cc488;--accent-fg:#06200f;--turmeric:#f0bb45;--on-dark:#eaf5e9;--on-dark-muted:#a9c9b2;--danger:#e8775f;
  --memo-bg:#231b10;--memo-ink:#f1e4cc;--memo-muted:#c9b48f;--memo-accent:#f0bb45;--memo-line:#4a3a22;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --forest:#0a2a20;--forest-2:#0f3a2c;--leaf:#4fb47a;--sprout:#8fd6a0;--paddy:#16271e;
  --bg:#0e1712;--surface:#14201a;--fg:#e4efe6;--muted:#9db5a5;--line:#24382d;
  --accent:#5cc488;--accent-fg:#06200f;--turmeric:#f0bb45;--on-dark:#eaf5e9;--on-dark-muted:#a9c9b2;--danger:#e8775f;
  --memo-bg:#231b10;--memo-ink:#f1e4cc;--memo-muted:#c9b48f;--memo-accent:#f0bb45;--memo-line:#4a3a22;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
.eyebrow{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
html[lang=ta] .eyebrow{letter-spacing:.02em;font-size:.9rem}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--fg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px 16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-dark);text-decoration:none;margin-right:auto}
.word{font-family:"Bricolage Grotesque",sans-serif;display:flex;align-items:baseline;line-height:1}
.word .s{font-weight:800;font-size:1.9rem;color:var(--leaf)}
.word .rest{font-weight:600;font-size:1.1rem;letter-spacing:.12em}
.found-line{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:#a87a0c;line-height:1;margin:0 0 3px 2px}
:root[data-theme="dark"] .found-line{color:var(--turmeric)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .found-line{color:var(--turmeric)}}
.brand small{display:block;font-size:.68rem;color:var(--on-dark-muted);letter-spacing:.03em;line-height:1.2;margin-top:3px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav.main a{color:var(--on-dark);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:.95rem}
nav.main a:hover{background:var(--paddy)}
nav.main a.cta{background:var(--accent);color:var(--accent-fg);font-weight:600}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;background:var(--paddy)}
.lang button{border:0;background:transparent;color:var(--fg);font:600 .9rem var(--font-body);padding:5px 12px;border-radius:999px;cursor:pointer;min-height:34px}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}

/* hero */
.hero{background:var(--forest);color:var(--on-dark);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(217,165,33,.35) 1.6px,transparent 2px);
  background-size:26px 26px;mask-image:linear-gradient(100deg,transparent 35%,#000 85%);-webkit-mask-image:linear-gradient(100deg,transparent 35%,#000 85%)}
.hero .wrap{position:relative;z-index:1;padding-block:56px 64px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.01em}
html[lang=ta] .hero h1{font-size:clamp(1.8rem,4.2vw,2.9rem);line-height:1.3;font-weight:700}
.hero h1 em{font-style:normal;color:var(--leaf)}
.hero .alt{font-size:1.15rem;color:var(--on-dark-muted);margin:14px 0 20px}
.hero p.lead{max-width:56ch;color:var(--on-dark);opacity:.92;margin:0 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:600 1rem var(--font-body);padding:12px 22px;border-radius:999px;text-decoration:none;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--on-dark);box-shadow:inset 0 0 0 1.5px var(--on-dark-muted)}
.btn.solid{background:var(--accent);color:var(--accent-fg)}
.btn.line{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn[disabled]{opacity:.6;cursor:default}
.facts{list-style:none;margin:0;padding:22px;border-radius:var(--r);background:var(--forest-2);display:grid;gap:14px;border:1px solid rgba(124,198,141,.25)}
.facts li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline}
.facts .n{font-family:"Bricolage Grotesque",sans-serif;font-size:1.9rem;font-weight:800;color:var(--leaf);min-width:2.4ch;font-variant-numeric:tabular-nums}
.facts .t{color:var(--on-dark)}
.facts .t small{display:block;color:var(--on-dark-muted);font-size:.85rem}

section{padding-block:64px}
.sec-head{display:grid;gap:8px;margin-bottom:28px;max-width:720px}
.sec-head h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.sec-head p{margin:0;color:var(--muted)}

/* courses */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.course .code{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.08em;color:var(--leaf);background:var(--paddy);padding:3px 10px;border-radius:999px;align-self:flex-start}
.course h3{font-size:1.3rem}
.course .tname{color:var(--muted);font-size:.95rem;margin-top:-6px}
.course p{margin:0}
.course .proj{font-size:.93rem;border-top:1px dashed var(--line);padding-top:10px;color:var(--muted)}
.course .proj b{color:var(--fg);font-weight:600}
.course .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.course .btn{padding:9px 16px;font-size:.95rem}
.found{background:var(--paddy);border-color:transparent}
.badge{font-size:.75rem;font-weight:600;color:#0b2a1d;background:var(--turmeric);padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* curriculum detail */
.detail{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.detail-head{background:var(--forest);color:var(--on-dark);padding:22px 24px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.detail-head h3{font-size:1.45rem;flex:1 1 280px}
.detail-head .meta{color:var(--on-dark-muted);font-size:.92rem;font-family:var(--font-body);font-weight:400;margin-top:6px}
.close{background:transparent;border:1.5px solid var(--on-dark-muted);color:var(--on-dark);border-radius:999px;padding:6px 14px;cursor:pointer;font:500 .9rem var(--font-body);min-height:40px}
.weeks{display:grid;grid-template-columns:repeat(4,1fr)}
.week{padding:20px 22px;border-right:1px solid var(--line);min-width:0}
.week:last-child{border-right:0}
.week .wk{font-family:var(--font-display);font-weight:700;color:var(--leaf);font-size:.88rem;letter-spacing:.06em;text-transform:uppercase}
.week h4{font-family:var(--font-display);font-size:1.08rem;margin:4px 0 8px;line-height:1.3}
.week ul{margin:0;padding-left:18px;font-size:.93rem}
.week li{margin-bottom:4px}
.week .hw{margin-top:10px;font-size:.88rem;background:var(--paddy);border-radius:10px;padding:8px 10px}
.detail-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.93rem;color:var(--muted)}

/* how it works */
.alt-band{background:var(--paddy)}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border-radius:var(--r);padding:20px;min-width:0}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;margin-bottom:10px}
.steps h3{font-size:1.08rem;margin-bottom:4px}
.steps p{margin:0;color:var(--muted);font-size:.95rem}
.needs{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.needs span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.93rem}

/* enroll */
.enroll{display:grid;grid-template-columns:1fr 1.4fr;gap:36px;align-items:start}
.enroll h2{font-size:clamp(1.6rem,3.4vw,2.4rem);margin:8px 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;min-width:0}
form{display:grid;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],select{font:inherit;font-weight:400;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--accent);outline:none}
fieldset{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;min-width:0}
legend{font-weight:600;font-size:.95rem;padding:0 6px}
.checks{display:grid;gap:10px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.checks input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.radios{display:flex;flex-wrap:wrap;gap:8px 16px}
.radios label{display:flex;gap:6px;align-items:center;font-weight:400}
.radios input{accent-color:var(--accent);width:18px;height:18px}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.consent input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.err{color:var(--danger);font-size:.92rem;margin:0}
.ok{background:var(--paddy);border-radius:12px;padding:16px;display:grid;gap:8px}
.ok h3{font-size:1.2rem;color:var(--leaf)}
.ok p{margin:0}
.note{font-size:.88rem;color:var(--muted);margin:0}
.side-list{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.side-list li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.side-list li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sprout);margin-top:9px;justify-self:center}
pre.copy{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;font:inherit;font-size:.88rem;margin:0}

/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-family:"Bricolage Grotesque",sans-serif;font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--leaf)}
.stat .l{font-size:.85rem;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;letter-spacing:.04em;color:var(--muted);background:var(--paddy)}
.pill{display:inline-block;background:var(--paddy);color:var(--leaf);border-radius:999px;padding:1px 8px;font-size:.78rem;font-weight:600;margin:1px 2px 1px 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar label{display:flex;gap:8px;align-items:center}
.toolbar select{width:auto}

/* fees & payment */
.fee{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;color:var(--leaf);font-variant-numeric:tabular-nums}
.course .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.course .fee small{font-family:var(--font-body);font-weight:500;font-size:.78rem;color:var(--muted);margin-left:4px}
.feeline{display:flex;justify-content:space-between;gap:12px;font-weight:600;border-top:1px dashed var(--line);margin-top:4px;padding-top:10px}
.checks .cfee{margin-left:auto;font-weight:600;color:var(--leaf);white-space:nowrap;font-variant-numeric:tabular-nums}
.checks label span.cname{flex:1;min-width:0}
.pay{display:grid;gap:14px;margin-top:6px}
.pay h3{font-size:1.25rem}
.bill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.bill div{display:flex;justify-content:space-between;gap:12px}
.bill .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.opt h4{margin:0;font-family:var(--font-display);font-size:1.05rem}
.opt p{margin:0;font-size:.93rem;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem}
.kv code{font:600 .95rem var(--font-body);background:var(--paddy);padding:3px 10px;border-radius:8px;user-select:all}
.kv button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:4px 10px;font:500 .85rem var(--font-body);cursor:pointer;min-height:32px}
.status{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.status.unpaid{background:#fbe9e5;color:#8a2f1f}
.status.pending{background:#fdf3d7;color:#7a5600}
.status.paid{background:var(--paddy);color:var(--leaf)}
.mini{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:3px 10px;font:600 .8rem var(--font-body);cursor:pointer;margin-top:4px}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:22px;display:grid;gap:14px}
.settings h3{font-size:1.15rem}
.settings p{margin:0;color:var(--muted);font-size:.93rem}

/* tribute */
.tribute{background:var(--memo-bg);color:var(--memo-ink);border-block:1px solid var(--memo-line);padding-block:80px;position:relative;overflow:hidden}
.tribute::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(217,165,33,.3) 1.6px,transparent 2px);
  background-size:26px 26px;mask-image:linear-gradient(260deg,transparent 40%,#000 95%);-webkit-mask-image:linear-gradient(260deg,transparent 40%,#000 95%)}
.tribute .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:44px;align-items:center}
.portrait{margin:0;display:grid;gap:12px;justify-items:center}
.portrait img{display:block;width:100%;height:auto;aspect-ratio:358/460;object-fit:cover;border-radius:18px;background:#fff;
  border:6px solid #fffaf0;box-shadow:0 0 0 2px var(--turmeric),0 18px 40px -20px rgba(0,0,0,.45)}
.portrait figcaption{font-family:var(--font-display);font-weight:600;color:var(--memo-muted);font-variant-numeric:tabular-nums;text-align:center}
.tr-text h2{font-size:clamp(1.7rem,3.6vw,2.5rem);margin:6px 0 4px}
.tr-alt{color:var(--memo-muted);margin:0 0 18px;font-size:1.02rem}
.tr-text p:not(.eyebrow):not(.tr-alt){max-width:62ch;margin:0 0 14px}
.tr-close{font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--memo-accent);border-left:4px solid var(--turmeric);padding-left:14px;margin-top:20px!important}
.ft-tribute{display:block;margin-top:4px}
@media (max-width:760px){.tribute .wrap{grid-template-columns:1fr;gap:28px}.portrait{max-width:260px;justify-self:center}}

/* section dividers */
.sec-div{position:relative;height:0;z-index:5}
.sec-div::before{content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);width:min(1120px,calc(100% - 32px));height:2px;
  background:linear-gradient(90deg,transparent,var(--turmeric) 18%,var(--leaf) 50%,var(--turmeric) 82%,transparent);opacity:.75}
.sec-div::after{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);width:min(420px,60%);height:10px;
  background-image:radial-gradient(circle,var(--turmeric) 2px,transparent 2.5px);background-size:16px 10px;background-position:center;
  mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.sec-div .orn{position:absolute;left:50%;top:0;transform:translate(-50%,-50%) rotate(45deg);width:46px;height:46px;border-radius:12px;z-index:1;
  background:var(--surface);border:2px solid var(--turmeric);display:grid;place-items:center;color:var(--leaf);box-shadow:0 6px 18px -10px rgba(0,0,0,.35)}
.sec-div .orn svg{width:28px;height:28px;transform:rotate(-45deg)}
.sec-div.memo::before{background:linear-gradient(90deg,transparent,var(--memo-accent) 20%,var(--memo-accent) 80%,transparent)}
.sec-div.memo .orn{background:var(--memo-bg);border-color:var(--memo-accent);color:var(--memo-accent);border-radius:50%;width:56px;height:56px;transform:translate(-50%,-50%)}
.sec-div.memo .orn svg{width:32px;height:32px;transform:none}
.tribute .eyebrow{color:var(--memo-accent)}
.tribute h2{color:var(--memo-ink)}

/* launch mode */
.launch-strip{background:#1f7a4d;color:#fff;text-align:center;font-size:.92rem;padding:8px 16px;line-height:1.4}
.launch-strip a{color:#fff;font-weight:700;margin-left:6px;white-space:nowrap}
.soon{display:inline-flex;align-items:center;gap:8px;background:var(--turmeric);color:#2a1d00;font-weight:700;font-size:.88rem;padding:4px 14px 4px 10px;border-radius:999px;margin:0 0 14px}
.soon::before{content:"";width:9px;height:9px;border-radius:50%;background:#1f7a4d;box-shadow:0 0 0 0 rgba(31,122,77,.6)}
@media (prefers-reduced-motion:no-preference){.soon::before{animation:pulse 1.8s infinite}}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(31,122,77,0)}100%{box-shadow:0 0 0 0 rgba(31,122,77,0)}}

footer{background:var(--forest);color:var(--on-dark-muted);font-size:.92rem}
footer .wrap{padding-block:32px;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
footer b{color:var(--on-dark)}

@media (max-width:900px){
  .hero .wrap,.enroll{grid-template-columns:1fr}
  .weeks{grid-template-columns:1fr 1fr}
  .week:nth-child(2){border-right:0}
  .week:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .steps{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .weeks,.steps,.two{grid-template-columns:1fr}
  .week{border-right:0;border-bottom:1px solid var(--line)}
  nav.main a:not(.cta){display:none}
  .hero .wrap{padding-block:40px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn,.course{transition:transform .15s ease,background .15s ease}.course:hover{transform:translateY(-2px)}}

/* admin page */
.gate{max-width:520px;margin:64px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;gap:14px;text-align:center}
.gate h1{font-size:1.6rem}
.gate p{margin:0;color:var(--muted)}
.who{font-size:.88rem;color:var(--muted)}
footer a{color:var(--on-dark)}

</style>
</head>

// Loads Firebase from Google's CDN only when a config is present.

const V = "10.12.2";
const firebaseReady = Boolean(firebaseConfig.apiKey && firebaseConfig.projectId);

let cached = null;
function fb() {
  if (!firebaseReady) return Promise.resolve(null);
  if (!cached) {
    cached = Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
    ]).then(([appMod, auth, fs]) => {
      const app = appMod.initializeApp(firebaseConfig);
      return { app, auth: auth.getAuth(app), authMod: auth, db: fs.getFirestore(app), fs };
    }).catch(err => { console.error("Firebase failed to load", err); return null; });
  }
  return cached;
}

const $ = s => document.querySelector(s);

const feeOf = codes => (codes || []).reduce((s, code) => s + ((COURSES.find(x => x.code === code) || {}).fee || 0), 0);
const safeLink = u => typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u.trim()) ? u.trim() : "";

let lang = "ta";

  let s = T[lang][k] ?? T.en[k] ?? k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace("{" + a + "}", b);
  return s;
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });

  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });

}

function startSite() {
let openDetail = null, doneState = null, lastErr = "";
let firebase = null, myRef = null;
let settings = mergeSettings({});

function mergeSettings(remote) {
  const stripe = { ...defaultPayments.stripe };
  for (const [k, v] of Object.entries(remote.stripe || {})) if (v) stripe[k] = v;
  return { whatsapp: remote.whatsapp || defaultPayments.whatsapp, upi: remote.upi || defaultPayments.upi, stripe };
}

function renderFormCourses() {

function updateTotal() { $("#feeTotal").textContent = fmt(feeOf(selectedCourses())); }

/* ---------- enrollment ---------- */
function readForm() {
  return {
    name: $("#fName").value.trim(),
    phone: $("#fPhone").value.replace(/\D/g, "").slice(-10),
    age: $("#fAge").value ? Number($("#fAge").value) : null,
    district: $("#fDistrict").value,
    village: $("#fVillage").value.trim(),
    courses: selectedCourses(),
    time: (document.querySelector("input[name=fTime]:checked") || {}).value || "",
    english: $("#fEnglish").value,
    device: $("#fDevice").value,
    language: getLang()
  };
}
function validate(f) {
  if (!f.name) return "err.name";
  if (f.phone.length !== 10) return "err.phone";
  if (!f.district) return "err.district";
  if (!f.courses.length) return "err.courses";
  if (!$("#fConsent").checked) return "err.consent";
  return "";
}
function summary(f) {
  return `${launchSoon ? "Samviikta – launch interest" : "Samviikta enrollment"}\nName: ${f.name}\nWhatsApp: ${f.phone}\nAge: ${f.age ?? "-"}\nDistrict: ${f.district}${f.village ? " (" + f.village + ")" : ""}\nCourses: ${f.courses.join(", ")}\nTotal fee: ${fmt(feeOf(f.courses))}\nClass time: ${f.time}\nEnglish: ${f.english}\nDevice: ${f.device}`;
}
function fillForm(f) {
  $("#fName").value = f.name || ""; $("#fPhone").value = f.phone || ""; $("#fAge").value = f.age ?? "";
  $("#fDistrict").value = f.district || ""; $("#fVillage").value = f.village || "";
  COURSES.forEach(c => { document.getElementById("c-" + c.code).checked = (f.courses || []).includes(c.code); });
  const r = [...document.querySelectorAll("input[name=fTime]")].find(x => x.value === f.time); if (r) r.checked = true;
  if (f.english) $("#fEnglish").value = f.english;
  if (f.device) $("#fDevice").value = f.device;
  $("#fConsent").checked = true;
  updateTotal();
}

$("#enrollForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = readForm(); lastErr = validate(f);
  const err = $("#formErr"); err.hidden = !lastErr; err.textContent = lastErr ? t(lastErr) : "";
  if (lastErr) return;
  if (!myRef) { showDone(f, false); return; }
  const btn = $("#submitBtn"); btn.disabled = true; btn.textContent = t("fl.saving");
  try {
    const { fs } = firebase;
    const prev = await fs.getDoc(myRef);
    const old = prev.exists() ? prev.data() : null;
    const doc = {
      ...f, amount: feeOf(f.courses),
      payment: (old && old.payment) || { status: "unpaid" },
      createdAt: (old && old.createdAt) || new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    await fs.setDoc(myRef, doc);
    showDone(doc, true);
  } catch (ex) {
    console.error(ex);
    lastErr = "err.save"; err.hidden = false; err.textContent = t(lastErr);
  } finally { btn.disabled = false; btn.textContent = t("fl.submit"); }
});

  const st = (f.payment && f.payment.status) || "unpaid";
  $("#enrollDone").innerHTML = saved
    ? `<div class="ok"><h3>${esc(t("done.title", { name: (f.name || "").split(" ")[0] }))}</h3>
        <p><b>${esc(t("done.courses"))}</b> ${names.map(esc).join(", ")}</p>
        <p class="note">${esc(t("done.note", { phone: f.phone }))}</p>
        ${launchSoon ? "" : payHtml(f)}
        ${st === "unpaid" ? `<div class="btns"><button class="btn line" type="button" id="editEnroll">${esc(t("done.change"))}</button></div>` : ""}</div>`
    : `<div class="ok"><h3>${esc(t("almost"))}</h3>
        <p>${esc(t("almost.p"))}</p>
        <pre class="copy" id="sumText">${esc(summary(f))}</pre>
        <div class="btns">${waSend(f)}<button class="btn ${waSend(f) ? "line" : "solid"}" type="button" data-copy-summary>${esc(t("copy"))}</button><button class="btn line" type="button" id="editEnroll">${esc(t("edit"))}</button></div>
        <p class="note" id="copySumNote" aria-live="polite"></p>
        ${launchSoon ? "" : payHtml(f)}</div>`;
  $("#enrollForm").hidden = true; $("#enrollDone").hidden = false;
  const ed = $("#editEnroll");
  if (ed) ed.onclick = () => { doneState = null; $("#enrollForm").hidden = false; $("#enrollDone").hidden = true; };
}

function waSend(f) {
  const wa = String(settings.whatsapp || "").replace(/\D/g, "");
  return wa.length >= 10 ? `<a class="btn solid" href="https://wa.me/${wa}?text=${encodeURIComponent(summary(f))}" target="_blank" rel="noopener">${esc(t("wa.send"))}</a>` : "";
}

function payHtml(f) {
  const codes = f.courses || [], total = feeOf(codes);
  const st = (f.payment && f.payment.status) || "unpaid";
  const bill = `<div class="bill">${codes.map(code => { const c = COURSES.find(x => x.code === code); return c ? `<div><span>${c.code} · ${esc(C(c).name)}</span><span>${fmt(c.fee)}</span></div>` : ""; }).join("")}
    <div class="tot"><span>${esc(t("total"))}</span><span>${fmt(total)}</span></div></div>`;
  if (st === "paid") return `<div class="pay">${bill}<p><span class="status paid">${esc(t("status.paid"))}</span> ${esc(t("pay.paid"))}</p></div>`;
  if (st === "pending") return `<div class="pay">${bill}<p><span class="status pending">${esc(t("status.pending"))}</span> ${esc(t("pay.pending"))}</p></div>`;

  const links = codes.map(code => {
    const u = safeLink(settings.stripe[code]), c = COURSES.find(x => x.code === code);
    return u && c ? `<a class="btn solid" href="${esc(u)}" target="_blank" rel="noopener">${esc(t("pay.payFor", { fee: fmt(c.fee), code }))}</a>` : "";
  }).filter(Boolean);
  const wa = String(settings.whatsapp || "").replace(/\D/g, "");
  const msg = t("wa.msg", { courses: codes.join(", "), name: f.name || "", total: fmt(total) });
  const waBlock = wa.length >= 10
    ? `<a class="btn solid" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${esc(t("pay.waBtn"))}</a>
       <div class="kv">${esc(t("pay.waNum"))}: <code>+${esc(wa)}</code><button type="button" data-copy="+${esc(wa)}">${esc(t("pay.copy"))}</button></div>`
    : `<p>${esc(t("pay.notSet"))}</p>`;
  const upi = String(settings.upi || "").trim();
  const upiBlock = upi ? `<div class="kv">${esc(t("pay.upi"))}: <code>${esc(upi)}</code><button type="button" data-copy="${esc(upi)}">${esc(t("pay.copy"))}</button>
      <a class="btn line" style="padding:6px 14px;min-height:36px" href="upi://pay?pa=${encodeURIComponent(upi)}&pn=Samviikta&am=${total}&cu=INR&tn=${encodeURIComponent("Samviikta " + codes.join(" "))}">${esc(t("pay.upiApp"))}</a></div>` : "";
  const claim = myRef ? `<form class="opt" id="payForm" novalidate>
      <h4>${esc(t("pay.doneH"))}</h4>
      <div class="two">
        <label for="pMethod">${esc(t("pay.method"))}<select id="pMethod"><option value="UPI / WhatsApp">${esc(t("pm.upi"))}</option><option value="Stripe">${esc(t("pm.stripe"))}</option></select></label>
        <label for="pRef">${esc(t("pay.ref"))}<input id="pRef" type="text" autocomplete="off"></label>
      </div>
      <p class="err" id="payErr" role="alert" hidden></p>
      <div class="btns"><button class="btn line" type="submit" id="paySubmit">${esc(t("pay.submit"))}</button></div>
    </form>` : "";
  return `<div class="pay">
    <h3>${esc(t("pay.h"))}</h3>
    <p class="note" style="font-size:.95rem">${esc(t("pay.p"))}</p>
    ${bill}
    <div class="opt"><h4>${esc(t("pay.online"))}</h4>
      ${links.length ? `<p>${esc(t("pay.onlineP"))}</p><div class="btns">${links.join("")}</div>` : `<p>${esc(t("pay.onlineSoon"))}</p>`}</div>
    <div class="opt"><h4>${esc(t("pay.wa"))}</h4><p>${esc(t("pay.waP"))}</p>${waBlock}${upiBlock}</div>
    ${claim}
  </div>`;
}

async function copyText(text, onOk, fallbackEl) {
  try { await navigator.clipboard.writeText(text); onOk(); }
  catch {
    if (fallbackEl) { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
}

document.addEventListener("click", e => {
  const s = e.target.closest("[data-show]"); if (s) showDetail(s.dataset.show);
  const en = e.target.closest("[data-enroll]");
  if (en) {
    const box = document.getElementById("c-" + en.dataset.enroll);
    if (box) { box.checked = true; updateTotal(); }
    $("#enroll").scrollIntoView({ block: "start" });
  }
  const cp = e.target.closest("[data-copy]");
  if (cp) copyText(cp.dataset.copy, () => { cp.textContent = t("pay.copied"); }, cp.previousElementSibling);
  if (e.target.closest("[data-copy-summary]") && doneState)
    copyText(summary(doneState.f), () => { $("#copySumNote").textContent = t("copied"); }, $("#sumText"));
});

document.addEventListener("submit", async e => {
  if (e.target.id !== "payForm") return;
  e.preventDefault();
  const ref = $("#pRef").value.trim(), method = $("#pMethod").value, err = $("#payErr");
  if (!ref) { err.hidden = false; err.textContent = t("pay.errRef"); return; }
  const btn = $("#paySubmit"); btn.disabled = true;
  const payment = { status: "pending", method, ref: ref.slice(0, 80), at: new Date().toISOString() };
  try {
    await firebase.fs.updateDoc(myRef, { payment, updatedAt: new Date().toISOString() });
    doneState.f = { ...doneState.f, payment };
    showDone(doneState.f, true);
  } catch (ex) { console.error(ex); err.hidden = false; err.textContent = t("pay.errSave"); btn.disabled = false; }
});

$("#fCourses").addEventListener("change", updateTotal);

/* ---------- start ---------- */
applyStatic();
renderAll();
setupLangToggle(renderAll);
$("#year").textContent = new Date().getFullYear();

(async () => {
  firebase = await fb();
  if (!firebase) return;
  const { auth, authMod, db, fs } = firebase;
  fs.onSnapshot(fs.doc(db, "settings", "payment"), snap => {
    settings = mergeSettings(snap.exists() ? snap.data() : {});
    if (doneState) showDone(doneState.f, doneState.saved);
  }, err => console.warn("Payment settings unavailable", err));
  try {
    if (!auth.currentUser) await authMod.signInAnonymously(auth);
    myRef = fs.doc(db, "enrollments", auth.currentUser.uid);
    const snap = await fs.getDoc(myRef);
    if (snap.exists()) { fillForm(snap.data()); showDone(snap.data(), true); }
  } catch (ex) {
    console.warn("Enrollment saving unavailable; using WhatsApp fallback.", ex);
    myRef = null;
  }
})();
}

function startAdmin() {
let firebase = null, allRows = [], adminState = "loading", settings = {}, setDirty = false;
let unsubs = [], gateKey = "adm.gateP", gateEmail = "";

/* ---------- rendering ---------- */
function renderAll() {
  $("#gateMsg").textContent = t(gateKey, { email: gateEmail });
  const fc = $("#filterCourse"), cur = fc.value;
  fc.innerHTML = `<option value="">${esc(t("a.all"))}</option>` + COURSES.map(c => `<option value="${c.code}">${c.code} · ${esc(C(c).name)}</option>`).join("");
  fc.value = cur;
  $("#thead").innerHTML = T[getLang()].th.map(h => `<th scope="col">${esc(h)}</th>`).join("");
  const vals = {};
  COURSES.forEach(c => { const el = document.getElementById("s-" + c.code); if (el) vals[c.code] = el.value; });
  $("#sStripe").innerHTML = COURSES.map(c => `<label for="s-${c.code}"><span>${esc(t("set.stripe", { code: c.code, fee: fmt(c.fee) }))}</span><input id="s-${c.code}" type="url" placeholder="https://buy.stripe.com/…"></label>`).join("");
  COURSES.forEach(c => { if (vals[c.code] != null) document.getElementById("s-" + c.code).value = vals[c.code]; });
  if (!setDirty) fillSettings();
  renderTable();
}

function fillSettings() {
  $("#sWa").value = settings.whatsapp || "";
  $("#sUpi").value = settings.upi || "";
  COURSES.forEach(c => { const el = document.getElementById("s-" + c.code); if (el) el.value = (settings.stripe || {})[c.code] || ""; });
}

function renderTable() {
  const fc = $("#filterCourse").value;
  const rows = allRows.filter(r => !fc || (r.courses || []).includes(fc));
  const collected = allRows.filter(r => r.payment && r.payment.status === "paid").reduce((s, r) => s + (r.amount ?? feeOf(r.courses)), 0);
  $("#stats").innerHTML =
    `<div class="stat"><div class="v">${allRows.length}</div><div class="l">${esc(t("a.total"))}</div></div>` +
    `<div class="stat"><div class="v">${fmt(collected)}</div><div class="l">${esc(t("a.collected"))}</div></div>` +
    COURSES.map(c => `<div class="stat"><div class="v">${allRows.filter(r => (r.courses || []).includes(c.code)).length}</div><div class="l">${c.code} · ${esc(C(c).name)}</div></div>`).join("");
  if (adminState !== "ready") { $("#rows").innerHTML = `<tr><td colspan="11">${esc(t("a." + adminState))}</td></tr>`; return; }
  $("#rows").innerHTML = rows.length ? rows.map(r => `<tr>
    <td>${esc((r.createdAt || "").slice(0, 10))}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.age ?? "")}</td>
    <td>${esc(r.district)}${r.village ? "<br><small>" + esc(r.village) + "</small>" : ""}</td>
    <td>${(r.courses || []).map(c => `<span class="pill">${esc(c)}</span>`).join("")}</td>
    <td style="white-space:nowrap">${fmt(r.amount ?? feeOf(r.courses))}</td>
    <td>${payCell(r)}</td>
    <td>${esc(r.time)}</td><td>${esc(r.english)}</td><td>${esc(r.device)}</td></tr>`).join("")
    : `<tr><td colspan="11">${esc(t("a.empty"))}</td></tr>`;
}

function payCell(r) {
  const p = r.payment || {}, st = ["paid", "pending"].includes(p.status) ? p.status : "unpaid";
  return `<span class="status ${st}">${esc(t("status." + st))}</span>` +
    (p.method ? `<br><small>${esc(p.method)}${p.ref ? " · " + esc(t("a.ref")) + ": " + esc(p.ref) : ""}</small>` : "") +
    (st !== "paid" ? `<br><button class="mini" type="button" data-markpaid="${esc(r._id)}">${esc(t("a.markPaid"))}</button>` : "");
}

/* ---------- actions ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-markpaid]");
  if (!b || !firebase) return;
  b.disabled = true;
  const { db, fs } = firebase;
  try {
    await fs.updateDoc(fs.doc(db, "enrollments", b.dataset.markpaid), { "payment.status": "paid", "payment.verifiedAt": new Date().toISOString() });
  } catch (ex) { console.error(ex); b.disabled = false; }
});

$("#filterCourse").addEventListener("change", renderTable);
$("#setForm").addEventListener("input", () => { setDirty = true; $("#setNote").textContent = ""; });
$("#setForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#setErr"); err.hidden = true;
  const wa = $("#sWa").value.replace(/\D/g, ""), upi = $("#sUpi").value.trim(), stripe = {};
  if (wa && (wa.length < 11 || wa.length > 15)) { err.hidden = false; err.textContent = t("set.badWa"); return; }
  for (const c of COURSES) {
    const v = document.getElementById("s-" + c.code).value.trim();
    if (v && !safeLink(v)) { err.hidden = false; err.textContent = t("set.badLink"); return; }
    stripe[c.code] = v;
  }
  const btn = $("#setSave"); btn.disabled = true;
  try {
    const { db, fs } = firebase;
    await fs.setDoc(fs.doc(db, "settings", "payment"), { whatsapp: wa, upi, stripe, updatedAt: new Date().toISOString() });
    setDirty = false; $("#setNote").textContent = t("set.saved");
  } catch (ex) { console.error(ex); err.hidden = false; err.textContent = t("set.fail"); }
  finally { btn.disabled = false; }
});

function csvText() {
  const head = ["Date", "Name", "WhatsApp", "Age", "District", "Village", "Courses", "Fee (INR)", "Payment status", "Payment method", "Payment ref", "Time", "English", "Device", "Site language"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return [head.join(",")].concat(allRows.map(r => {
    const p = r.payment || {};
    return [(r.createdAt || "").slice(0, 10), r.name, r.phone, r.age, r.district, r.village, (r.courses || []).join(" "), r.amount ?? feeOf(r.courses), p.status || "unpaid", p.method, p.ref, r.time, r.english, r.device, r.language].map(q).join(",");
  })).join("\n");
}
$("#downloadCsv").addEventListener("click", () => {
  const blob = new Blob(["﻿" + csvText()], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `samviikta-enrollments-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$("#copyCsv").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(csvText()); $("#copyNote").textContent = t("a.copied"); }
  catch { $("#copyNote").textContent = t("a.nocopy"); }
});

/* ---------- auth ---------- */
function showGate(key, email = "") {
  gateKey = key; gateEmail = email;
  $("#gateMsg").textContent = t(key, { email });
  $("#gate").hidden = false; $("#admin").hidden = true;
}

function stopListening() { unsubs.forEach(u => u()); unsubs = []; allRows = []; adminState = "loading"; }

async function enterDashboard(user) {
  const { db, fs } = firebase;
  try {
    const me = await fs.getDoc(fs.doc(db, "admins", user.email));
    if (!me.exists()) throw new Error("not admin");
  } catch {
    showGate("adm.notAdmin", user.email); return;
  }
  $("#gate").hidden = true; $("#admin").hidden = false;
  unsubs.push(fs.onSnapshot(fs.doc(db, "settings", "payment"), s => {
    settings = s.exists() ? s.data() : {};
    if (!setDirty) fillSettings();
  }));
  const timer = setTimeout(() => { if (adminState === "loading") { adminState = "slow"; renderTable(); } }, 10000);
  unsubs.push(fs.onSnapshot(fs.collection(db, "enrollments"), snap => {
    clearTimeout(timer);
    allRows = snap.docs.map(d => ({ ...d.data(), _id: d.id })).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    adminState = "ready"; renderTable();
  }, ex => { console.error(ex); clearTimeout(timer); adminState = "fail"; renderTable(); }));
}

applyStatic();
renderAll();
setupLangToggle(renderAll);

(async () => {
  if (!firebaseReady) { showGate("adm.notConfigured"); $("#signIn").hidden = true; return; }
  firebase = await fb();
  if (!firebase) { showGate("adm.notConfigured"); $("#signIn").hidden = true; return; }
  const { auth, authMod } = firebase;
  $("#signIn").addEventListener("click", async () => {
    try { await authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider()); }
    catch (ex) { console.error(ex); showGate("adm.signinFail"); }
  });
  $("#signOut").addEventListener("click", () => authMod.signOut(auth));
  authMod.onAuthStateChanged(auth, user => {
    stopListening();
    const signedIn = user && !user.isAnonymous;
    $("#signOut").hidden = !signedIn;
    $("#signIn").hidden = !!signedIn;
    $("#who").textContent = signedIn ? user.email : "";
    if (signedIn) enterDashboard(user); else showGate("adm.gateP");
  });
})();
}

if (ADMIN_MODE) {
  document.getElementById("top").hidden = true;
  document.getElementById("siteNav").hidden = true;
  document.getElementById("adminView").hidden = false;
  document.getElementById("adminNav").hidden = false;
  document.getElementById("year").textContent = new Date().getFullYear();
  document.title = "Samviikta Admin";
  startAdmin();
} else {
  startSite();
}
</script>
